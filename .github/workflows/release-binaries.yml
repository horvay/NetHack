name: Release Linux and Windows binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example, v5.0.0-electron.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison flex libncurses-dev

      - name: Configure minimal Linux build
        working-directory: sys/unix
        run: sh setup.sh hints/linux-minimal

      - name: Build and install Linux package
        run: |
          make fetch-Lua
          make all
          make install

      - name: Create relocatable Linux release archive
        run: |
          mkdir -p release/nethack-linux-x64/lib/runtime-libs
          cp -a "$HOME/nethack-minimal/games/lib/nethackdir" release/nethack-linux-x64/lib/
          cp -L /lib/x86_64-linux-gnu/libncurses.so.6 release/nethack-linux-x64/lib/runtime-libs/
          cp -L /lib/x86_64-linux-gnu/libtinfo.so.6 release/nethack-linux-x64/lib/runtime-libs/
          cat > release/nethack-linux-x64/nethack <<'EOF'
          #!/bin/sh
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          LD_LIBRARY_PATH="$root/lib/runtime-libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          exec "$root/lib/nethackdir/nethack" -d "$root/lib/nethackdir" "$@"
          EOF
          chmod 0755 release/nethack-linux-x64/nethack
          tar -C release -czf release/nethack-linux-x64.tar.gz nethack-linux-x64

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: nethack-linux-x64
          path: release/nethack-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Fetch Windows build dependencies
        shell: cmd
        run: |
          sys\windows\fetch.cmd lua
          sys\windows\fetch.cmd pdcursesmod

      - name: Build Windows release package
        shell: cmd
        run: msbuild sys\windows\vs\NetHack.sln /m /t:package /p:Configuration=Release /p:Platform=x64

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: nethack-windows-x64
          path: vspackage/nethack-*-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
