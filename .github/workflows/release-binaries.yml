name: Release NetHack Electron

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example, v5.0.0-electron.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 Electron app
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-poc/package-lock.json

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison flex libncurses-dev uuid-dev

      - name: Install Electron dependencies
        working-directory: electron-poc
        run: npm ci

      - name: Verify packaged runtime contract
        working-directory: electron-poc
        run: npm run test:packaged-runtime

      - name: Build Electron AppImage
        working-directory: electron-poc
        run: npm run package:linux

      - name: Upload Electron application
        uses: actions/upload-artifact@v4
        with:
          name: nethack-electron-linux-x64
          path: electron-poc/dist/NetHack-Electron-*-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
