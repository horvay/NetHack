name: Native platform contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"
  push:
    branches:
      - electron-ui
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"

permissions:
  contents: read

jobs:
  platform-contract:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and run native platform contract
        working-directory: electron-poc
        run: npm run test:platform-contract
