name: Native platform contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"
      - "sys/windows/windmain.c"
      - "win/shim/**"
  push:
    branches:
      - electron-ui
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"
      - "sys/windows/windmain.c"
      - "win/shim/**"

permissions:
  contents: read

jobs:
  platform-contract:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and run native platform contract
        working-directory: electron-poc
        run: npm run test:platform-contract

  windows-bridge:
    name: Windows native bridge
    runs-on: windows-2022
    steps:
      - name: Check out source and Lua
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure static libuv bridge
        working-directory: electron-poc
        run: cmake -S shim-bridge -B .native-build -DNH_BUILD_NATIVE_BRIDGE=ON -DNH_ELECTRON_TEST_FIXTURES=ON

      - name: Build native bridge
        working-directory: electron-poc
        run: cmake --build .native-build --config Release --target nh_shim_bridge

      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: nh-shim-bridge-windows-x64
          path: electron-poc/shim-bridge/nh-shim-bridge.exe
          if-no-files-found: error
