name: Native platform contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/scripts/prepare-*-release.js"
      - "electron-poc/src/main/packaged-runtime.js"
      - "electron-poc/test/shared/packaged-runtime-test.js"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"
      - "sys/windows/windmain.c"
      - "sys/windows/windsys.c"
      - "win/shim/**"
  push:
    branches:
      - electron-ui
    paths:
      - ".github/workflows/platform-contract.yml"
      - "electron-poc/package.json"
      - "electron-poc/scripts/prepare-*-release.js"
      - "electron-poc/src/main/packaged-runtime.js"
      - "electron-poc/test/shared/packaged-runtime-test.js"
      - "electron-poc/shim-bridge/**"
      - "electron-poc/test/native/**"
      - "sys/windows/windmain.c"
      - "sys/windows/windsys.c"
      - "win/shim/**"

permissions:
  contents: read

jobs:
  platform-contract:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and run native platform contract
        working-directory: electron-poc
        run: npm run test:platform-contract

  windows-bridge:
    name: Windows native bridge
    runs-on: windows-2022
    steps:
      - name: Check out source and Lua
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure static libuv bridge
        working-directory: electron-poc
        run: cmake -S shim-bridge -B .native-build -DNH_BUILD_NATIVE_BRIDGE=ON -DNH_ELECTRON_TEST_FIXTURES=ON

      - name: Build native bridge
        working-directory: electron-poc
        run: cmake --build .native-build --config Release --target nh_shim_bridge

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bridge protocol contract
        working-directory: electron-poc
        run: node test/native/bridge-protocol-contract.js shim-bridge/nh-shim-bridge.exe

      - name: Build traditional Windows runtime data
        working-directory: .
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          msbuild sys\windows\vs\NetHack.sln /m /t:package /p:Configuration=Release /p:Platform=x64

      - name: Extract Windows runtime data
        shell: pwsh
        run: |
          $zip = Get-Item "vspackage\\nethack-500-win-x64.zip"
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\\nethack-runtime" -Force

      - name: Install Electron dependencies
        working-directory: electron-poc
        run: npm ci

      - name: Stage Windows Electron runtime
        working-directory: electron-poc
        run: node scripts/prepare-windows-release.js "$env:RUNNER_TEMP\\nethack-runtime"

      - name: Build portable Windows Electron app
        working-directory: electron-poc
        run: npm run package:windows

      - name: Run packaged Windows gameplay smoke
        working-directory: electron-poc
        shell: pwsh
        run: |
          $app = Get-Item "dist\\NetHack-Electron-*-windows-x64.exe"
          node test/native/packaged-electron-smoke.js $app.FullName test-output/platform-contract/windows-gameplay.png

      - name: Upload Windows gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gameplay-evidence
          path: electron-poc/test-output/platform-contract/windows-gameplay.png
          if-no-files-found: warn

      - name: Upload portable Electron app
        uses: actions/upload-artifact@v4
        with:
          name: nethack-electron-windows-x64
          path: electron-poc/dist/NetHack-Electron-*-windows-x64.exe
          if-no-files-found: error

      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: nh-shim-bridge-windows-x64
          path: electron-poc/shim-bridge/nh-shim-bridge.exe
          if-no-files-found: error

  linux-bridge:
    name: Linux native bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison flex libncurses-dev uuid-dev

      - name: Configure NetHack
        run: |
          cd sys/unix
          sh setup.sh hints/linux.500
          cd ../..
          make fetch-Lua

      - name: Build static libuv bridge
        working-directory: electron-poc
        run: npm run build:shim

      - name: Run bridge protocol contract
        working-directory: electron-poc
        run: node test/native/bridge-protocol-contract.js shim-bridge/nh-shim-bridge

      - name: Install Electron dependencies
        working-directory: electron-poc
        run: npm ci

      - name: Build Linux Electron app
        working-directory: electron-poc
        run: npm run package:linux

      - name: Run packaged Linux gameplay smoke
        working-directory: electron-poc
        run: xvfb-run --auto-servernum node test/native/packaged-electron-smoke.js dist/linux-unpacked/nethack-electron test-output/platform-contract/linux-gameplay.png

      - name: Upload Linux gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gameplay-evidence
          path: electron-poc/test-output/platform-contract/linux-gameplay.png
          if-no-files-found: warn

      - name: Upload Linux Electron app
        uses: actions/upload-artifact@v4
        with:
          name: nethack-electron-linux-x64
          path: electron-poc/dist/NetHack-Electron-*-linux-x86_64.AppImage
          if-no-files-found: error
